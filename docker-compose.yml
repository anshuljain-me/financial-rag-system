version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_rag_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_rag_dashboard
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - api
      - redis
    command: streamlit run dashboard/main.py --server.port 8501 --server.address 0.0.0.0

  redis:
    image: redis:7.2-alpine
    container_name: financial_rag_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data

volumes:
  redis_cache_data:
    driver: local
